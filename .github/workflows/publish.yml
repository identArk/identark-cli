name: Publish to PyPI

# PyPI's trusted publisher is bound to this filename and the `pypi`
# environment. Coordinate any rename with the PyPI project configuration.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Verify release version
        run: uv run --no-sync python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Verify source
        run: |
          uv run ruff format --check identark_cli tests scripts
          uv run ruff check identark_cli tests scripts
          uv run mypy identark_cli
          uv run pytest

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: uv run python scripts/check_distribution.py dist/*

      - name: Verify wheel installs independently
        run: |
          python -m venv /tmp/identark-cli-wheel-check
          /tmp/identark-cli-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/identark-cli-wheel-check/bin/identark --version

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/identark-cli
    permissions:
      id-token: write

    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
