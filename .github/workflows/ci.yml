name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run ruff format --check identark_cli tests scripts

      - name: Lint
        run: uv run ruff check identark_cli tests scripts

      - name: Type check
        run: uv run mypy identark_cli

      - name: Run tests
        run: uv run pytest

  package:
    name: Build and inspect public distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Build distributions
        run: uv build

      - name: Inspect public boundary
        run: uv run python scripts/check_distribution.py dist/*

      - name: Verify wheel installs independently
        run: |
          python -m venv /tmp/identark-cli-wheel-check
          /tmp/identark-cli-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/identark-cli-wheel-check/bin/identark --version
