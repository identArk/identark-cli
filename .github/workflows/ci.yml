name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run ruff format --check identark_cli tests scripts

      - name: Lint
        run: uv run ruff check identark_cli tests scripts

      - name: Type check
        run: uv run mypy identark_cli

      - name: Run tests
        run: uv run pytest

  package:
    name: Build and inspect public distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Build distributions
        run: uv build

      - name: Inspect public boundary
        run: uv run python scripts/check_distribution.py dist/*

      - name: Verify wheel installs independently
        run: |
          python -m venv /tmp/identark-cli-wheel-check
          /tmp/identark-cli-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/identark-cli-wheel-check/bin/identark --version
