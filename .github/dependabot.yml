version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      # One pull request for all action bumps. Actions that ship as several
      # sub-actions (github/codeql-action/init and /analyze, for example) must
      # move together, and separate pull requests leave them mismatched.
      github-actions:
        patterns: ["*"]
