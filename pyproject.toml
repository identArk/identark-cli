[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identark-cli"
version = "0.1.0"
description = "IdentArk CLI - AI agent credential isolation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "IdentArk", email = "support@identark.io"}
]
keywords = ["security", "credentials", "ai", "agents", "vault"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "keyring>=25.0.0",
    "gitpython>=3.1.0",
    "toml>=0.10.2",
    "watchdog>=4.0.0",
    "python-socketio[client]>=5.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
identark = "identark_cli.main:app"

[project.urls]
Homepage = "https://identark.io"
Documentation = "https://docs.identark.io/cli"
Repository = "https://github.com/identark/cli"
Issues = "https://github.com/identark/cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["identark_cli"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
