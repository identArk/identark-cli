[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identark-cli"
dynamic = ["version"]
description = "IdentArk CLI - credential references, approvals, and managed access for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "IdentArk", email = "support@identark.io"}
]
keywords = ["security", "credentials", "ai", "agents", "vault"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "keyring>=25.0.0",
    "toml>=0.10.2",
    "watchdog>=4.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
identark = "identark_cli.main:app"

[project.urls]
Homepage = "https://identark.io"
Documentation = "https://docs.identark.io/cli"
Repository = "https://github.com/identArk/backend/tree/main/cli"
Issues = "https://github.com/identArk/backend/issues"

[tool.hatch.version]
path = "identark_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["identark_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=identark_cli --cov-report=term-missing --cov-fail-under=50"
